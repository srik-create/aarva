# Aarva web service — Render.com deployment config.
#
# Provider-specific: this file is what Render reads to provision the
# service. The actual build artefact (Dockerfile at repo root) is
# portable to any host; only this YAML is Render-shaped. To migrate
# to Fly.io / Railway / DigitalOcean / Kubernetes, add the equivalent
# config file for that provider; the Dockerfile stays unchanged.
#
# See docs/deploy.md for the full setup runbook (one-time account
# creation, env-var injection, Cloudflare DNS for aarva.app).

services:
  - type: web
    name: aarva-web
    runtime: docker
    plan: starter          # ~$7/month; bump to standard if needed
    dockerfilePath: ./Dockerfile
    region: oregon         # change to fra / ord / sin for latency to your audience
    healthCheckPath: /health
    autoDeploy: true       # rebuild on git push to main
    envVars:
      # Persistent disk mount path — SQLite DB lives here, survives
      # deploys.
      - key: AARVA_DB_PATH
        value: /data/aarva.db
      - key: AARVA_LOG_LEVEL
        value: INFO
      # Update once Cloudflare DNS points aarva.app at this service.
      - key: AARVA_SERVER_PUBLIC_URL
        value: https://aarva.app
      # Shared secret for the /admin/sync-db endpoint. NOT stored in
      # this file — set the value manually in the Render dashboard
      # (Environment tab). Must match the value in ~/.aarva.env on the
      # operator's laptop. Generate with:
      #     python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
      - key: AARVA_RENDER_SYNC_TOKEN
        sync: false
      # R2 credentials — used by /admin/sync-db to pull the gzipped
      # SQLite snapshot the laptop has uploaded to R2. Same values as
      # the AARVA_R2_* vars in ~/.aarva.env on the laptop. Set
      # manually in the Render dashboard; the bucket + endpoint URL
      # come from aarva/config/pipeline.yaml (already in the
      # container) so they don't need to be duplicated here.
      - key: AARVA_R2_ACCESS_KEY_ID
        sync: false
      - key: AARVA_R2_SECRET_ACCESS_KEY
        sync: false
      # Resend API key — drives the "your episode is ready" email
      # sent to listeners after an on-demand build completes.
      # Set in the Render dashboard. When unset, aarva/services/email.py
      # automatically falls back to a stub (logs only) — useful for
      # staging or for development branches that shouldn't email.
      - key: RESEND_API_KEY
        sync: false
      # Optional: override the From header. Default in the code is
      # "Aarva <hello@aarva.app>". Set this only if you want a
      # different display name / address.
      - key: AARVA_EMAIL_FROM
        sync: false

    # 1 GB persistent disk for the SQLite DB + future state. SQLite
    # is ~80-200 MB; this leaves room for the next year+ of growth.
    # Render's smallest disk size; ~$0.25/month.
    disk:
      name: aarva-data
      mountPath: /data
      sizeGB: 1
