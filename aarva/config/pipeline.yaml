# Aarva pipeline configuration — v0.1
#
# All tunable parameters of the pipeline live here so changes don't need code.

paths:
  db: aarva/data/aarva.db
  audio_dir: aarva/output/audio
  web_dir: aarva/output/web
  rss_feed: aarva/output/feed.xml

ingestion:
  # How many entries to consider per feed per run. RSS feeds typically return
  # ~10-30 items; we cap to avoid runaway extraction on misbehaving feeds.
  max_entries_per_feed: 30
  # How many days back to ingest. RSS feeds often include older items; we
  # cap to recent-ish content for v0.1.
  lookback_days: 7
  # Per-request timeout when fetching feeds and article pages.
  http_timeout_seconds: 30
  # User agent for HTTP requests.
  user_agent: "Aarva/0.1 (research; +aarva.app)"

filters:
  # Stage 2 word-count floor. From kickoff §2.
  word_floor: 600
  # Listicle-style headlines we drop at Stage 2.
  listicle_keywords:
    - "top 10"
    - "top ten"
    - "best of"
    - " ways to "
    - " reasons "
    - " things you "
    - " things to "

consolidation:
  # Backend for similarity computation. Options: embeddings | tfidf.
  #   - embeddings: persistent vector representations, "living vector space"
  #     (recommended default; same vectors power personalisation, drift
  #     detection, cross-time relevance later).
  #   - tfidf: re-fits per run; cheaper deps, but representations don't
  #     persist. Useful in PyTorch-constrained environments.
  method: embeddings

  # Cosine-similarity threshold for clustering. The right value differs by
  # backend because the two methods produce different similarity distributions:
  #   - embeddings (BGE-base): same-event duplicates ~0.85-0.93; different
  #     framings of same event ~0.65-0.75; unrelated topics ~0.30-0.45.
  #     0.78 captures duplicates while preserving framing diversity.
  #   - tfidf: same-event duplicates ~0.22-0.25; different framings ~0.13-0.15;
  #     unrelated ~0.00. 0.20 captures duplicates while preserving framing.
  # Re-tune against your real data once you've ingested a week's worth and run
  # the compare_consolidation script.
  similarity_threshold: 0.78

  # No single publication may contribute more than this many pieces to the
  # consolidated pool (anti-source-dominance).
  max_per_publication: 3

# Embedding backend (used by Stage 1.5 and later by personalisation).
embedding:
  # Options: local | openai
  #   - local: sentence-transformers on user's machine. Free. No API key.
  #     Requires `pip install sentence-transformers` (~2GB with PyTorch).
  #     First run downloads model (~110MB for bge-base-en-v1.5).
  #   - openai: OpenAI embeddings API. ~$0.50/month at Aarva's volume.
  #     Requires OPENAI_API_KEY env var and `pip install openai`.
  provider: local
  # Model identifier. For 'local': any sentence-transformers / HuggingFace
  # model. For 'openai': 'text-embedding-3-small' or 'text-embedding-3-large'.
  # Leave null to use the default for the provider.
  model: BAAI/bge-base-en-v1.5

assembly:
  slots:
    deep_feature: 1
    lens_card_future: 1
    lens_card_humans: 1
    lens_card_behind: 1
    curiosity: 1
    smart_escape: 1
  length_distribution:
    short: 0.30   # <= 8 minutes
    medium: 0.50  # 8-15 minutes
    long: 0.20    # > 15 minutes
  trending_cap: 0.50

scoring:
  # Stage 4 hard-gate thresholds. From Q5.
  rigour_min: 0.5
  posture_min: 0.5
  # Ranking score weights. From Q5.
  rigour_weight: 0.45
  posture_weight: 0.45
  self_implication_weight: 0.10
  # Prompt version pin (matches a key in prompts.yaml).
  prompt_version: v1

llm:
  # Default provider. Options: claude_code, anthropic_api.
  provider: claude_code
  # Timeout for a single LLM call.
  timeout_seconds: 120
  # Sampling temperature. Low for classification, slightly higher for hooks.
  temperature_classify: 0.1
  temperature_generate: 0.6

tts:
  # Provider. v0.1 ships kokoro (lightweight ONNX, designed for long-form
  # narration, runs well on MacBook Air's 8GB profile). Alternatives:
  # chatterbox (higher quality voice-cloning but hangs on MBA MPS),
  # macos_say (Apple's built-in `say`), piper (lower-quality fallback).
  provider: kokoro

  # Kokoro model + voices files (downloaded from
  # github.com/thewh1teagle/kokoro-onnx/releases/tag/model-files-v1.0)
  model_path: aarva/models/kokoro-v1.0.onnx
  voices_path: aarva/models/voices-v1.0.bin

  # Map Aarva-level voice IDs to Kokoro preset voice names.
  # af_bella:  American, warm, the most-recommended long-form Kokoro voice
  #            (Grade A in 2026 community rankings).
  # bm_george: British, authoritative, "velvet-smooth tone for professional
  #            narration." Picked after auditioning vs am_michael —
  #            felt closer to Aarva's editorial register. Earlier candidate
  #            bm_daniel was too flat with poor sentence transitions.
  # Easy to swap by editing these strings.
  voice_map:
    female: af_bella
    male:   bm_george

  voice_default: female
  voice_alternate: male

  # Voice-selection rule for Stage 9.
  #   alternate_with_gender_match: gender-matched for first-person articles,
  #     alternating between voice_default and voice_alternate otherwise.
  #   alternate: pure alternation by position (no LLM call required).
  #   single: always voice_default (no per-piece selection).
  voice_selection_rule: alternate_with_gender_match

  # Kokoro-specific controls.
  lang: en-us
  speed: 1.0
  max_chunk_chars: 1500   # Kokoro handles longer chunks comfortably

  # Hard cap on a single synthesis run (seconds).
  timeout_seconds: 600

  # — Chatterbox fallback (used when provider: chatterbox) —
  # device: mps
  # voices: {female: aarva/voices/female_ref.wav, male: aarva/voices/male_ref.wav}
  # exaggeration: 0.5
  # cfg_weight: 0.5

  # — macOS say fallback (used when provider: macos_say) —
  # voice_default: Serena (Premium)
  # voice_alternate: Jamie (Premium)

  # — Piper fallback (used when provider: piper) —
  # model_path: ~/.piper-voices/en_GB-northern_english_male-medium.onnx
