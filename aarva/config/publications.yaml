# Aarva publication allowlist — v0.1
#
# Each entry is a publication. Fields:
#   name             — display name
#   rss_url          — RSS / Atom feed URL
#   homepage         — pub homepage (for reference)
#   tier             — A through H per kickoff doc §2
#   enabled          — true / false. Toggling is a one-line change.
#   licence_status   — informal note: open | cc_licensed | metered | paywalled | republishable
#   notes            — anything worth remembering
#
# v0.1 ingests Tier A/B/C/E/D where feeds are open and full text is fetchable.
# Tier F (heterodox bench), G (paywalled crumbs), and H (smart escape) are
# deferred to v0.2 — they need extra handling (extra tonal scrutiny / paywall
# fishing / different ingestion patterns).
#
# RSS URLs verified against typical publisher feed conventions; some may need
# adjustment as we run real ingestion. The on/off switch is the `enabled` flag.

