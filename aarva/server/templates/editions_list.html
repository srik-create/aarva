{% extends "base.html" %}
{% block title %}Past editions — Aarva{% endblock %}
{% block content %}
  <div class="mb-10">
    <p class="text-xs text-cream-muted uppercase tracking-widest">Browse</p>
    <h1 class="editorial text-4xl font-bold tracking-tightish mt-2 text-cream-text">Past editions</h1>
  </div>
  {% if editions %}
    <ul class="divide-y divide-night-border bg-night-soft rounded-2xl border border-night-border overflow-hidden">
      {% for ed in editions %}
        <li>
          <a href="/edition/{{ ed.edition_date }}" class="block px-6 py-4 hover:bg-night-border transition-colors">
            <span class="editorial text-lg font-semibold text-cream-text">{{ ed.edition_date }}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-cream-muted">No editions yet.</p>
  {% endif %}
{% endblock %}
