{% extends "base.html" %}
{% block title %}Past editions — Aarva{% endblock %}
{% block content %}
  <div class="mb-10">
    <p class="text-xs text-ink-muted uppercase tracking-widest">Browse</p>
    <h1 class="editorial text-4xl font-bold tracking-tightish mt-2 text-ink">Past editions</h1>
  </div>
  {% if editions %}
    <ul class="divide-y divide-border-soft bg-paper rounded-2xl border border-border-soft overflow-hidden">
      {% for ed in editions %}
        <li>
          <a href="/edition/{{ ed.edition_date }}" class="block px-6 py-4 hover:bg-cream transition-colors">
            <span class="editorial text-lg font-semibold text-ink">{{ ed.edition_date }}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-ink-muted">No editions yet.</p>
  {% endif %}
{% endblock %}
