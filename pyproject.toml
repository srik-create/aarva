[project]
name = "aarva"
version = "0.1.0"
description = "AI-narrated, AI-curated journalism. A reboot of Curio's editorial promise on a fully automated curation engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Srikant", email = "srikant@gibran.ai"},
]
dependencies = [
    # Ingestion
    "feedparser>=6.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "python-dateutil>=2.8",
    # Stage 1.5 consolidation
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    # LLM clients (also used by Stage 9 TTS via Gemini native audio)
    "google-genai>=1.0",
    "anthropic>=0.40",
    # Stage 9 TTS uses google-genai (above). Kokoro/onnxruntime
    # removed when Gemini TTS replaced Kokoro.
    # Config / utilities
    "pyyaml>=6.0",
    "click>=8.1",
    # Asset generation
    "Pillow>=10.0",
    # Doc reading
    "python-docx>=1.0",
]

[project.optional-dependencies]
# OpenAI embeddings backend (alternative to local sentence-transformers).
# Set embedding.provider: openai in pipeline.yaml to activate.
openai_embeddings = [
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aarva = "aarva.daily:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aarva"]

[tool.pytest.ini_options]
testpaths = ["aarva/tests"]
