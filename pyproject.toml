[project]
name = "aarva"
version = "0.1.0"
description = "AI-narrated, AI-curated journalism. A reboot of Curio's editorial promise on a fully automated curation engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Srikant", email = "srikant@gibran.ai"},
]
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.1",
    "httpx>=0.27",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aarva = "aarva.daily:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aarva"]

[tool.pytest.ini_options]
testpaths = ["aarva/tests"]
